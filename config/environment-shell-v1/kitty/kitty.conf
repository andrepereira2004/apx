# APX terminal theme — mirrors Quickshell's 85% panel.
background #0a1014
foreground #e8f7fa
background_opacity 0.85
dynamic_background_opacity yes
selection_background #246879
selection_foreground #e8f7fa
cursor #55e6ff
cursor_text_color #0a1014
cursor_shape beam
cursor_beam_thickness 1.2
cursor_blink_interval 0.65
url_color #55e6ff
color0 #0a1014
color1 #ff91a4
color2 #8bd49c
color3 #ffc36b
color4 #55e6ff
color5 #c099ff
color6 #55e6ff
color7 #e8f7fa
color8 #52656d
color9 #ffb3c0
color10 #a7e3b3
color11 #ffd58d
color12 #a6f3ff
color13 #d2b9ff
color14 #a6f3ff
color15 #ffffff
font_family Cascadia Mono
font_size 11.5
window_padding_width 14
confirm_os_window_close 0
enable_audio_bell no
shell_integration enabled

shell /usr/bin/bash --rcfile /home/apx/.config/apx/bashrc -i
