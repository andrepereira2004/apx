general {
    hide_cursor = true
    # Empty Enter completes a timed-out password prompt and starts a fresh PAM
    # cycle. When installed, pam_howdy runs first; typed input still falls back
    # to the normal password stack when facial recognition does not succeed.
    ignore_empty_input = false
    immediate_render = true
}

animations {
    enabled = true
    bezier = apxEase, 0.22, 1, 0.36, 1
    animation = fade, 1, 2.5, apxEase
    animation = inputField, 1, 2.5, apxEase
}

background {
    monitor =
    color = rgba(10, 16, 20, 1.0)
    blur_passes = 0
}

label {
    monitor =
    text = APX
    color = rgba(236, 238, 240, 1.0)
    font_size = 26
    font_family = Selawik
    position = 0, 132
    halign = center
    valign = center
}

label {
    monitor =
    text = Sessão bloqueada
    color = rgba(155, 163, 172, 1.0)
    font_size = 16
    font_family = Selawik
    position = 0, 88
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 380, 56
    outline_thickness = 1
    dots_size = 0.22
    dots_spacing = 0.20
    dots_center = true
    outer_color = rgba(52, 58, 65, 1.0)
    inner_color = rgba(25, 29, 34, 1.0)
    font_color = rgba(236, 238, 240, 1.0)
    check_color = rgba(85, 230, 255, 1.0)
    fail_color = rgba(255, 145, 164, 1.0)
    font_family = Selawik
    placeholder_text = <span foreground="##9ba3ac">Palavra-passe</span>
    check_text = <span foreground="##eceef0">A autenticar…</span>
    fail_text = <span foreground="##ff91a4">Não foi possível autenticar</span>
    fade_on_empty = false
    rounding = 10
    position = 0, 4
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:300] /home/apx/.local/bin/apx-face-auth-state-v1
    color = rgba(155, 163, 172, 1.0)
    font_size = 11
    font_family = Selawik
    position = 0, -62
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(155, 163, 172, 1.0)
    font_size = 14
    font_family = Selawik
    position = 0, 36
    halign = center
    valign = bottom
}

# The keyboard layout is useful when entering the fallback password.
label {
    monitor =
    text = $LAYOUT
    color = rgba(155, 163, 172, 1.0)
    font_size = 10
    font_family = Selawik
    position = 0, -104
    halign = center
    valign = center
}
