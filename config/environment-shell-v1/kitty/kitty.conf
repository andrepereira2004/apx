# APX terminal — shared Control Centre graphite palette.
background #101117
foreground #d9dcea
background_opacity 0.85
dynamic_background_opacity yes
selection_background #353a4a
selection_foreground #d9dcea
cursor #8ebaff
cursor_text_color #101117
cursor_shape beam
cursor_beam_thickness 1.2
cursor_blink_interval 0.65
url_color #8ebaff
color0 #101117
color1 #ff91a4
color2 #8bd49c
color3 #ffc36b
color4 #8ebaff
color5 #c099ff
color6 #8ebaff
color7 #d9dcea
color8 #69728a
color9 #ffb3c0
color10 #a7e3b3
color11 #ffd58d
color12 #a6f3ff
color13 #d2b9ff
color14 #a6f3ff
color15 #ffffff
font_family JetBrains Mono
font_size 11
window_padding_width 18
confirm_os_window_close 0
enable_audio_bell no
shell_integration enabled

shell /usr/bin/bash --rcfile /home/apx/.config/apx/bashrc -i

# Environment-local, owner-selected appearance tint.
include apx-appearance.conf
